[build-system]
requires = ["setuptools>=71.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-krono-cli"
version = "0.1.0"
description = "A股投研+预测一体化流水线 — TradingAgents + Kronos 并行分析"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "trade-krono-cli"}
]
dependencies = [
    # ── 核心运行时（TA 分析、数据获取、风险引擎均依赖）────────────────
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "baostock>=0.8.8",
    # cli-anything-tradingagents 已移至外部项目管理（external/repos.yaml + repo.lock）
    # 不再作为 PyPI 依赖引入，避免与 TradingAgents-astock 产生包级耦合
    "akshare>=1.18.88",
    "mootdx>=0.11.7",
    "fire",
    "openai>=3.14.0",
    "langchain-core>=1.6.3",
    "iniconfig>=2.3.0",
    "platformdirs>=4.11.12",
    "protobuf>=7.36.2",
    "prompt-toolkit>=3.0.53",
    "yfinance>=1.7.0",
    "stockstats>=0.6.9",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-experimental",
    "torch>=2.13.0",
    "transformers>=5.19.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "questionary>=2.1.1",
]

[project.optional-dependencies]
# ── TA 分析模式（不含 Kronos 预测，不装 torch）──────────────────────
ta = []
# 空组：安装 pip install trade-krono-cli[ta] 时仅安装核心依赖

# ── Kronos 预测模式（需 PyTorch，GPU 推理可选）──────────────────────
kronos = [
    "torch>=2.0.0",
]

# ── 数据源扩展（可选，按需安装）────────────────────────────────────
akshare = ["akshare>=1.10.0"]
mootdx = ["mootdx>=0.11.0"]
tushare = ["tushare>=1.2.0"]
data = [
    "akshare>=1.10.0",
    "mootdx>=0.11.0",
    "tushare>=1.2.0",
]

# ── 开发工具 ───────────────────────────────────────────────────────
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# ── 完整安装（所有功能 + 开发工具）─────────────────────────────────
full = [
    "torch>=2.0.0",
    "akshare>=1.10.0",
    "mootdx>=0.11.0",
    "tushare>=1.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
trade-krono-cli = "trade_krono_cli.cli:main"

[tool.setuptools.packages.find]
include = ["trade_krono_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["trade_krono_cli"]
omit = [
    "trade_krono_cli/cli_commands.py",
    "trade_krono_cli/research_db.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
fail_on_error = true

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=2.3.1",
    "pyarrow>=25.0.1",
    "pytest-cov>=4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["external/**", ".venv/", "*.md", "*.yml", "*.env*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I001", "S", "B", "C4", "UP", "SIM", "TCH"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "G004", "S101", "S607", "S301", "S324"]
# domain/__init__.py 中 types 枚举必须优先导入以避免循环依赖，跳过 I001 排序检查
[tool.ruff.lint.per-file-ignores]
"trade_krono_cli/domain/__init__.py" = ["I001"]
"trade_krono_cli/analytics_db/**/*.py" = ["S608"]
"trade_krono_cli/cache/queries.py" = ["S603", "S608"]
"trade_krono_cli/artifact_manifest/**/*.py" = ["S603"]
"trade_krono_cli/trading_constraints/**/*.py" = ["TC001", "TC003"]
"trade_krono_cli/universe/**/*.py" = ["SIM102"]
"trade_krono_cli/ta_decision/**/*.py" = ["SIM102"]
"trade_krono_cli/research_db/**/*.py" = ["S608", "SIM105"]
"trade_krono_cli/cli.py" = ["S110"]
"trade_krono_cli/bs_session.py" = ["B904"]
"trade_krono_cli/cli_commands/**/*.py" = ["B904", "S311"]
"trade_krono_cli/committee/**/*.py" = ["B904"]
"trade_krono_cli/data_providers/**/*.py" = ["B904", "S110"]
"trade_krono_cli/security.py" = ["B904"]
"trade_krono_cli/utils/st_cache.py" = ["SIM105"]
"scripts/**/*.py" = ["S607", "S301", "S108", "S110", "UP015", "TC001", "TC003", "S603", "S608", "S112", "SIM113", "SIM102", "SIM115", "C420", "SIM105"]
# 测试中的 /tmp 路径是 fixture，不用于生产，豁免 S108；S105 测试用假凭证；B017 断言异常类型
"tests/**/*.py" = ["S108", "S105", "B017", "S608", "S603", "S110", "S112", "S103", "B007", "B018"]
# 本地 subprocess 调用（git / feishu CLI）非攻击面
"trade_krono_cli/external/**/*.py" = ["S603"]
"trade_krono_cli/notify/**/*.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_return_any = true
warn_no_return = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
disable_error_code = ["import-untyped", "import-not-found", "no-any-return"]
exclude = ["external/", ".venv/", "tests/", "backtest_kronos.py"]
