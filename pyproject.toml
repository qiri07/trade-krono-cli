[build-system]
requires = ["setuptools>=71.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-krono-cli"
version = "0.1.0"
description = "A股投研+预测一体化流水线 — TradingAgents + Kronos 并行分析"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "trade-krono-cli"}
]
dependencies = [
    # ── 核心运行时（TA 分析、数据获取、风险引擎均依赖）────────────────
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "baostock>=0.8.8",
    # cli-anything-tradingagents 已移至外部项目管理（external/repos.yaml + repo.lock）
    # 不再作为 PyPI 依赖引入，避免与 TradingAgents-astock 产生包级耦合
    "akshare>=1.18.88",
    "mootdx>=0.11.7",
]

[project.optional-dependencies]
# ── TA 分析模式（不含 Kronos 预测，不装 torch）──────────────────────
ta = []
# 空组：安装 pip install trade-krono-cli[ta] 时仅安装核心依赖

# ── Kronos 预测模式（需 PyTorch，GPU 推理可选）──────────────────────
kronos = [
    "torch>=2.0.0",
]

# ── 数据源扩展（可选，按需安装）────────────────────────────────────
akshare = ["akshare>=1.10.0"]
mootdx = ["mootdx>=0.11.0"]
tushare = ["tushare>=1.2.0"]
data = [
    "akshare>=1.10.0",
    "mootdx>=0.11.0",
    "tushare>=1.2.0",
]

# ── 开发工具 ───────────────────────────────────────────────────────
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# ── 完整安装（所有功能 + 开发工具）─────────────────────────────────
full = [
    "torch>=2.0.0",
    "akshare>=1.10.0",
    "mootdx>=0.11.0",
    "tushare>=1.2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
trade-krono-cli = "trade_krono_cli.cli:main"

[tool.setuptools.packages.find]
include = ["trade_krono_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
environments = [
    "sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyarrow>=25.0.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["external/**", ".venv/", "*.md", "*.yml", "*.env*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "G004"]
# domain/__init__.py 中 types 枚举必须优先导入以避免循环依赖，跳过 I001 排序检查
per-file-ignores = { "trade_krono_cli/domain/__init__.py" = ["I001"] }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["external/", ".venv/", "tests/"]
