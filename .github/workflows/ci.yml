# ═══════════════════════════════════════════════════════
# 持续集成 — lint / type-check / test
#
# 触发：每次 push / PR 到 main 分支
# ═══════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        task: [lint, type-check, test]

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 uv 环境（Python 3.12）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: 安装开发依赖（含数据源扩展）
        run: uv sync --dev --all-extras

      - name: Ruff Lint
        if: matrix.task == 'lint'
        run: uv run ruff check .

      - name: Ruff Format Check
        if: matrix.task == 'lint'
        run: uv run ruff format --check .

      - name: MyPy 类型检查
        if: matrix.task == 'type-check'
        run: uv run mypy .

      - name: 运行测试（含覆盖率）
        if: matrix.task == 'test'
        run: uv run pytest --cov=trade_krono_cli --cov-report=xml -x

      - name: 上传覆盖率报告
        if: matrix.task == 'test' && github.event_name == 'push'
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── 飞书通知：所有 Job 完成后统一发送一次 ───────────────────────────
  notify:
    name: 飞书通知
    needs: check
    if: always() && vars.FEISHU_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 uv 环境（Python 3.12）
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: 安装依赖
        run: uv sync --dev

      - name: 判断整体状态
        id: status
        run: |
          if needs.check.result == 'success'; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif needs.check.result == 'cancelled'; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: 汇总 Job 结果
        id: jobs
        run: |
          parts=()
          for task in lint type-check test; do
            r="${{ needs.check.result }}"
            if [ "$r" = "success" ]; then
              parts+=("${task}✅")
            elif [ "$r" = "cancelled" ]; then
              parts+=("${task}⏹️")
            else
              parts+=("${task}❌")
            fi
          done
          echo "jobs=$(IFS='  '; echo "${parts[*]}")" >> $GITHUB_OUTPUT

      - name: 推送飞书通知
        if: vars.FEISHU_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          uv run python scripts/feishu_notify.py ci \
            --status ${{ steps.status.outputs.status }} \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --jobs "${{ steps.jobs.outputs.jobs }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --url "${{ vars.FEISHU_WEBHOOK_URL }}"
